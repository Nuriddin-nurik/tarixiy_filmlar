name: tarixiy_filimlar
description: "A new Flutter project."


publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1



dependencies:
  flutter:
    sdk: flutter

  
  
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  infinite_carousel: ^1.1.1
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  get: ^4.7.3
  
  sqflite: ^2.4.2+1
  path_provider: ^2.1.3
  
  # API Network va kesh
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  google_sign_in: ^6.2.1
  
  # Video Player (media_kit)
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  path: ^1.9.1
  url_launcher: ^6.3.3
  flutter_cache_manager: ^3.4.5
  pointycastle: ^4.0.0
  flutter_secure_storage: ^11.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: 19.4.0
  flutter_foreground_task: ^11.0.3
  connectivity_plus: ^7.3.1
  flutter_svg: ^2.3.0




dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0





flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/

  # Figma dizaynidagi shriftlar (ilova ichida — internetsiz ham ishlaydi)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerif-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerif-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
  
  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
